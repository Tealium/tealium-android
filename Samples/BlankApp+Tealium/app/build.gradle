apply plugin: 'com.android.application'

android {
    namespace = 'com.tealium.blankapp'
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.tealium.blankapp"
        minSdkVersion 19
        targetSdkVersion 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.tealium:library:5.9.7'
}
